{% extends 'base.html' %}

{% block title %}Modifica camera — Locanda del Colle{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h2 class="mb-1">Modifica camera</h2>
            <p class="text-muted mb-4">Piano {{ camera.piano }}, n. {{ camera.numerocamera }}
                <span class="small">(piano e numero non sono modificabili: fanno parte della chiave della camera)</span>
            </p>
        
            <form method="post">
            {% csrf_token %}

                <div class="mb-3">
                    <label for="tipologia" class="form-label">Tipologia</label>
                    <select class="form-select" id="tipologia" name="tipologia" required>
                        <option value="singola" {% if camera.tipologia == 'singola' %}selected{% endif %}>Singola</option>
                        <option value="doppia" {% if camera.tipologia == 'doppia' %}selected{% endif %}>Doppia</option>
                        <option value="matrimoniale" {% if camera.tipologia == 'matrimoniale' %}selected{% endif %}>Matrimoniale</option>
                        <option value="suite" {% if camera.tipologia == 'suite' %}selected{% endif %}>Suite</option>
                    </select>
                </div>
            
                <div class="mb-3">
                    <label for="numero_massimo_ospiti" class="form-label">Numero massimo ospiti</label>
                    <input type="number" class="form-control" id="numero_massimo_ospiti" name="numero_massimo_ospiti" min="1" value="{{ camera.numeromassimoospiti }}" required>
                </div>
            
                <div class="mb-3">
                    <label for="descrizione" class="form-label">Descrizione</label>
                    <textarea class="form-control" id="descrizione" name="descrizione" rows="3" required>{{ camera.descrizione }}</textarea>
                </div>
            
                <div class="mb-4">
                    <label for="prezzo_base_notte" class="form-label">Prezzo base per notte (€)</label>
                    <input type="number" step="0.01" class="form-control" id="prezzo_base_notte" name="prezzo_base_notte" value="{{ camera.prezzobasenotte }}" required>
                </div>
            
                <button type="submit" class="btn btn-clay w-100">Salva modifiche</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
