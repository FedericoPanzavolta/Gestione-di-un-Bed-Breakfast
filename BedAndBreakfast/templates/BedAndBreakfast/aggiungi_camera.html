{% extends 'base.html' %}

{% block title %}Aggiungi camera — Locanda del Colle{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h2 class="mb-4">Aggiungi camera</h2>
            
            <form method="post">
            {% csrf_token %}

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="piano" class="form-label">Piano</label>
                        <input type="number" class="form-control" id="piano" name="piano" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="numero_camera" class="form-label">Numero camera</label>
                        <input type="number" class="form-control" id="numero_camera" name="numero_camera" required>
                    </div>
                </div>
            
                <div class="mb-3">
                    <label for="tipologia" class="form-label">Tipologia</label>
                    <select class="form-select" id="tipologia" name="tipologia" required>
                        <option value="singola">Singola</option>
                        <option value="doppia">Doppia</option>
                        <option value="matrimoniale">Matrimoniale</option>
                        <option value="suite">Suite</option>
                    </select>
                </div>
            
                <div class="mb-3">
                    <label for="numero_massimo_ospiti" class="form-label">Numero massimo ospiti</label>
                    <input type="number" class="form-control" id="numero_massimo_ospiti" name="numero_massimo_ospiti" min="1" required>
                </div>
            
                <div class="mb-3">
                    <label for="descrizione" class="form-label">Descrizione</label>
                    <textarea class="form-control" id="descrizione" name="descrizione" rows="3" required></textarea>
                </div>
            
                <div class="mb-4">
                    <label for="prezzo_base_notte" class="form-label">Prezzo base per notte (€)</label>
                    <input type="number" step="0.01" class="form-control" id="prezzo_base_notte" name="prezzo_base_notte" required>
                </div>
            
                <button type="submit" class="btn btn-clay w-100">Aggiungi camera</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
