{% extends 'base.html' %}

{% block title %}Aggiungi stagione — Locanda del Colle{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h2 class="mb-4">Aggiungi stagione</h2>
            
            <form method="post">
            {% csrf_token %}

                <div class="mb-3">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" class="form-control" id="nome" name="nome" placeholder="es. Alta stagione estiva 2027" required>
                </div>
            
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="data_inizio" class="form-label">Data inizio</label>
                        <input type="date" class="form-control" id="data_inizio" name="data_inizio" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="data_fine" class="form-label">Data fine</label>
                        <input type="date" class="form-control" id="data_fine" name="data_fine" required>
                    </div>
                </div>
            
                <div class="mb-4">
                    <label for="moltiplicatore" class="form-label">Moltiplicatore di prezzo</label>
                    <input type="number" step="0.01" min="0" class="form-control" id="moltiplicatore" name="moltiplicatore" placeholder="es. 1.30" required>
                </div>
            
                <button type="submit" class="btn btn-clay w-100">Aggiungi stagione</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
